# --- SERVER CONFIGURATION ---
server.port=8080
# No context-path - Swagger UI will be at root, APIs will use @RequestMapping prefix
server.url=http://localhost:${server.port}

# ===== JWT CONFIG =====
# Secret key JWT (>= 32 characters)
app.jwt.secret=ZGF5LWxhLWNodW9pLWJpLW1hdC1jdWEtYmFkbWludG9uLWRhdGUtcHJvamVjdA==
# Access token 15 minutes
app.jwt.access-ttl-ms=900000
# Refresh token 7 days
app.jwt.refresh-ttl-ms=604800000

# ===== PAYMENT GATEWAY CONFIG =====
# Return URL after payment gateway (mock: points to FE result page)
app.payment.return-url=http://localhost:5173/payment/result

# --- DATABASE CONFIG (H2 File-based for persistence) ---
spring.datasource.url=jdbc:h2:file:./data/franchise;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9092
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 CONSOLE (web interface) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- LOGGING (verbose for development) ---
# Disable noisy logs
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.springframework.orm.deprecation=ERROR
logging.level.com.zaxxer.hikari=WARN

# --- SWAGGER / OPENAPI CONFIGURATION ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Hide the Models/Schemas section at the bottom
springdoc.swagger-ui.defaultModelsExpandDepth=-1

