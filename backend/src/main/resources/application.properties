spring.application.name=franchise

#Default profile active
spring.profiles.active=dev
# --- COMMON CONFIGURATION (shared across all environments) ---
# Specific values are set in application-dev.properties and application-prod.properties
# Server Configuration
# JWT Configuration
# JPA Hibernate
# Strict JSON parsing
spring.jackson.deserialization.accept-float-as-int=false

# --- Swagger/OpenAPI Configuration ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
# tags-sorter intentionally omitted — tag order is defined in OpenApiConfig.java
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.doc-expansion=none
vnpay.version=2.1.0
vnpay.command=pay
vnpay.currency-code=VND
vnpay.locale=vn

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
