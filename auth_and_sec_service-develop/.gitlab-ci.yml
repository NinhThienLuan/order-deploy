stages:
  - validate
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end"

cache:
  paths:
    - .m2/repository/

lint-commit:
  stage: validate
  image: alpine:latest
  script:
    - |
      PATTERN="^(feat|fix|docs|style|refactor|test|chore|perf|revert|hotfix|wip): .+"
      MSG=$(echo "$CI_COMMIT_MESSAGE" | head -1)

      # Skip merge commit & revert commit tự sinh bởi GitLab
      if echo "$MSG" | grep -qE "^(Merge|Revert) "; then
        echo "Skipping auto-generated commit: $MSG"
        exit 0
      fi

      if ! echo "$MSG" | grep -qE "$PATTERN"; then
        echo "-------------------------------------------"
        echo "Commit message sai format!"
        echo "Commit hien tai: $MSG"
        echo "Dung format   : feat: noi dung"
        echo "Prefix hop le : feat|fix|docs|style|refactor|test|chore|perf|revert|hotfix|wip"
        echo "-------------------------------------------"
        exit 1
      fi
      echo "Commit message hop le: $MSG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS compile -DskipTests
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml

package:
  stage: package
  image: maven:3.9.6-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - main
    - develop
