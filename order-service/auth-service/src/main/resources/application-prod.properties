# ========================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ========================================

# --- SERVER CONFIGURATION ---
server.port=${SERVER_PORT:8082}
server.url=${SERVER_URL:https://api.franchise.com}

# --- EUREKA CLIENT (Production) ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
eureka.instance.hostname=${HOSTNAME:auth-service}
eureka.instance.prefer-ip-address=false

# ===== DATABASE (PostgreSQL) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- H2 CONSOLE (disabled in production) ---
spring.h2.console.enabled=false

# ===== REDIS =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# ===== MAIL =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# ===== JWT CONFIG =====
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-ms=${JWT_ACCESS_TTL:900000}
app.jwt.refresh-ttl-ms=${JWT_REFRESH_TTL:604800000}

# --- LOGGING (minimal for production) ---
logging.level.root=INFO
logging.level.fsoft.franchise=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# --- SWAGGER / OPENAPI CONFIGURATION (disabled in production) ---
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
