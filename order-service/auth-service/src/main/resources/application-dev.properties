# ========================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ========================================

# --- SERVER CONFIGURATION ---
server.port=8082
server.url=http://localhost:${server.port}

# --- EUREKA CLIENT (Development) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ===== DATABASE (H2 File-based for persistence) =====
spring.datasource.url=jdbc:h2:file:./data/auth;AUTO_SERVER=TRUE;AUTO_SERVER_PORT=9093
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- H2 CONSOLE (web interface) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===== REDIS =====
# Redis disabled for development - refresh tokens will not persist across restarts
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.data.redis.timeout=2000ms

# ===== MAIL (optional - configure if needed) =====
