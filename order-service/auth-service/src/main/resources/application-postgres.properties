#spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ===== JWT CONFIG =====
app.jwt.secret=ZGF5LWxhLWNodW9pLWJpLW1hdC1jdWEtYmFkbWludG9uLWRhdGUtcHJvamVjdA==
app.jwt.access-ttl-ms=900000
app.jwt.refresh-ttl-ms=604800000

# --- LOGGING ---
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.boot.devtools=WARN
logging.level.org.springframework.orm.deprecation=ERROR
logging.level.com.zaxxer.hikari=WARN
