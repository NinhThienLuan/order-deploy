# ========================================
# POSTGRESQL PROFILE CONFIGURATION
# ========================================
# Use this profile for local PostgreSQL development
# Run with: --spring.profiles.active=postgres

# --- SERVER CONFIGURATION ---
server.port=8082
server.url=http://localhost:${server.port}

# --- EUREKA CLIENT ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# ===== DATABASE (PostgreSQL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db?options=-c%20TimeZone%3DUTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- H2 CONSOLE (disabled) ---
spring.h2.console.enabled=false

# ===== REDIS =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ===== MAIL (optional - configure if needed) =====
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=YOUR_EMAIL@gmail.com
#spring.mail.password=YOUR_APP_PASSWORD
#spring.mail.properties.mail.smtp.auth=true
