server:
  port: 8080 # Cổng mặt tiền để Postman/FE gọi vào

spring:
  main:
    allow-bean-definition-overriding: true # Ép Spring cho phép ghi đè các Bean trùng tên
  application:
    name: api-gateway # Tên của Gateway khai báo với tổng đài
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]': # Áp dụng cho tất cả các đường dẫn
            allowedOriginPatterns:
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
              - "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # ====================================================
        # AUTH-SERVICE ROUTES (Higher priority - more specific paths first)
        # ====================================================
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**,/api/v1/accounts/**,/api/v1/forget-password/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
          
        # ====================================================
        # ORDER-SERVICE ROUTES (Catch remaining /api/* requests)
        # ====================================================
        - id: order-service-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/** # Bất kỳ request nào còn lại bắt đầu bằng /api/

eureka:
  instance:
    prefer-ip-address: true # Để Gateway gọi qua IP, tránh lỗi UnknownHost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

