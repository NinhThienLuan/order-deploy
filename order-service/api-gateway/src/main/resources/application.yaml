server:
  port: 8080 # Cổng mặt tiền để Postman/FE gọi vào

spring:
  main:
    allow-bean-definition-overriding: true # Ép Spring cho phép ghi đè các Bean trùng tên
  application:
    name: api-gateway # Tên của Gateway khai báo với tổng đài
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]': # Áp dụng cho tất cả các đường dẫn
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:5174"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # ====================================================
        # ROUTE DUY NHẤT: ĐẨY TẤT CẢ VỀ ORDER-SERVICE
        # ====================================================
        - id: all-in-one-order-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/** # Bất kỳ request nào bắt đầu bằng /api/ đều về đây

eureka:
  instance:
    prefer-ip-address: true # Để Gateway gọi qua IP, tránh lỗi UnknownHost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/