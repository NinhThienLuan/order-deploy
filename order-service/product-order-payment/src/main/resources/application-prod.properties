# --- SERVER CONFIGURATION ---
server.port=${PORT:8081}
server.url=${SERVER_URL:http://3.27.221.137:8081}

# --- EUREKA CLIENT (Production) ---
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=3.27.221.137
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port=${server.port}

# --- JWT CONFIG ---
app.jwt.secret=${JWT_SECRET:ZGF5LWxhLWNodW9pLWJpLW1hdC1jdWEtYmFkbWludG9uLWRhdGUtcHJvamVjdA==}
# Access token 15 minutes
app.jwt.access-ttl-ms=900000
# Refresh token 7 days
app.jwt.refresh-ttl-ms=604800000

# --- DATABASE CONFIG (MySQL on EC2) ---
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/franchise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:franchise}
spring.datasource.password=${DB_PASSWORD:franchise_secret}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# First deploy: use 'create' to build schema from scratch.
# After tables are created successfully, change to 'update' to preserve data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- H2 CONSOLE: disabled in production ---
spring.h2.console.enabled=false

# --- SWAGGER: optionally disable in prod ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# --- LOGGING ---
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.fsoft.franchise=INFO
logging.level.org.springframework.boot.autoconfigure=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.com.zaxxer.hikari=WARN

