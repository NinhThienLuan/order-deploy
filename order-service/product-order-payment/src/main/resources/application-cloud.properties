# ========================================
# CLOUD DEPLOY PROFILE (Render / Railway)
# No Dockerfile required
# ========================================

# --- SERVER ---
server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.url=${SERVER_URL:http://localhost:${PORT:8081}}

# --- DISCOVERY (disable by default for Render/Railway single-service deploy) ---
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://eureka-server-oonv.onrender.com/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:${RAILWAY_PUBLIC_DOMAIN:localhost}}}
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port=${server.port}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:ZGF5LWxhLWNodW9pLWJpLW1hdC1jdWEtYmFkbWludG9uLWRhdGUtcHJvamVjdA==}
app.jwt.access-ttl-ms=${JWT_ACCESS_TTL:900000}
app.jwt.refresh-ttl-ms=${JWT_REFRESH_TTL:604800000}

# --- DATABASE (Render/Railway managed DB) ---
# IMPORTANT: DB_URL must be a JDBC URL (e.g. jdbc:postgresql://host:5432/db)
spring.datasource.url=${DB_JDBC_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:railway}}}}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:${PGUSER:${POSTGRES_USER:postgres}}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:}}}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# --- SERVICE INTEGRATION URLS ---
integration.franchise-store.base-url=${FRANCHISE_STORE_BASE_URL:https://isodimorphous-basilia-controvertible.ngrok-free.dev}
integration.inventory.base-url=${INVENTORY_BASE_URL:http://localhost:8080}

# --- SWAGGER ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# --- LOGGING ---
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

