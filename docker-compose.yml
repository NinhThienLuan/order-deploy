# ==============================================
# Docker Compose — Franchise App (EC2 Production)
# IP: 3.27.221.137
# ==============================================

services:

  # ---- MySQL Database ----
  mysql:
    image: mysql:8.0
    container_name: franchise-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: franchise
      MYSQL_USER: franchise
      MYSQL_PASSWORD: ${DB_PASSWORD:-franchise_secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - franchise-net

  # ---- Spring Boot Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: franchise-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database
      DB_URL: jdbc:mysql://mysql:3306/franchise?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
      DB_USERNAME: franchise
      DB_PASSWORD: ${DB_PASSWORD:-franchise_secret}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-1xk-i7i6bJnZ_VBmzOMNNTe6bxk_RhMgZSX56Ye0QK4WATtCu64ECFhFpRlUzAOwM0m-IJ77blkfkIoWflfRWA}
      # MoMo
      MOMO_RETURN_URL: http://3.27.221.137:8080/api/v1/payments/momo/return
      MOMO_FRONTEND_URL: http://3.27.221.137:3000/payment/result
      MOMO_NOTIFY_URL: http://3.27.221.137:8080/api/v1/payments/momo/callback
      # VNPay
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-9PJF2F6F}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-PSCVGW8CL9PVQXY3HKS8ASF1XUR8VYGI}
      VNPAY_RETURN_URL: http://3.27.221.137:8080/api/v1/payments/vnpay-return
    ports:
      - "8080:8080"
    networks:
      - franchise-net

  # ---- React Frontend (nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://3.27.221.137:8080
    container_name: franchise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - franchise-net

volumes:
  mysql_data:

networks:
  franchise-net:
    driver: bridge
